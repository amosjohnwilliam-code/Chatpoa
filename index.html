<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chatpoa</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f2f5f7;
    }

    .topbar {
      height: 60px;
      background: #1877f2;
      color: white;
      display: flex;
      align-items: center;
      padding: 0 15px;
    }

    .menuBtn {
      font-size: 30px;
      cursor: pointer;
      margin-right: 15px;
    }

    .topbar h2 {
      margin: 0;
    }

    .container {
      max-width: 450px;
      margin: 20px auto;
      background: white;
      padding: 20px;
      border-radius: 15px;
    }

    input,
    textarea,
    select,
    button {
      width: 100%;
      padding: 12px;
      margin: 7px 0;
      border-radius: 8px;
      border: 1px solid #ccc;
    }

    button {
      background: #1877f2;
      color: white;
      border: none;
      font-weight: bold;
      cursor: pointer;
    }

    .secondary {
      background: #555;
    }

    .hidden {
      display: none !important;
    }

    #sideMenu {
      position: fixed;
      top: 60px;
      left: 0;
      width: 240px;
      background: white;
      box-shadow: 2px 4px 10px #0003;
      padding: 15px;
      z-index: 20;
    }

    #sideMenu button {
      background: white;
      color: #222;
      text-align: left;
      border-bottom: 1px solid #eee;
    }

    .searchBox {
      display: flex;
      gap: 5px;
    }

    .searchBox input {
      flex: 1;
    }

    .searchBox button {
      width: 90px;
    }

    .sectionTitle {
      margin-top: 25px;
      border-bottom: 1px solid #ddd;
      padding-bottom: 8px;
    }

    .chatCard {
      padding: 14px;
      margin: 8px 0;
      background: #f5f7f9;
      border-radius: 10px;
      cursor: pointer;
    }

    .chatCard:hover {
      background: #e5edf7;
    }

    .chatName {
      font-weight: bold;
      font-size: 17px;
    }

    .lastMessage {
      color: #666;
      margin-top: 5px;
      font-size: 14px;
    }

    .profileIcon {
      width: 80px;
      height: 80px;
      background: #ddd;
      border-radius: 50%;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 35px;
    }

    #chatMessages {
      min-height: 180px;
      max-height: 400px;
      overflow-y: auto;
      background: #f5f5f5;
      padding: 10px;
      border-radius: 10px;
    }

    .message {
      padding: 9px 12px;
      margin: 6px 0;
      border-radius: 10px;
      max-width: 80%;
      word-wrap: break-word;
    }

    .myMessage {
      background: #1877f2;
      color: white;
      margin-left: auto;
    }

    .theirMessage {
      background: white;
      color: #222;
      margin-right: auto;
    }

    #message,
    #profileMessage,
    #groupMessage,
    #privateMessage {
      text-align: center;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div id="authArea" class="container">

  <h1>Karibu Chatpoa</h1>

  <h2>Jisajili</h2>

  <input type="text" id="name" placeholder="Jina lako">

  <input type="email" id="email" placeholder="Email">

  <input type="password" id="password" placeholder="Password">

  <button id="signupBtn">Jisajili</button>

  <hr>

  <h2>Login</h2>

  <input type="email" id="loginEmail" placeholder="Email">

  <input type="password" id="loginPassword" placeholder="Password">

  <button id="loginBtn">Login</button>

  <p id="message"></p>

</div>


<div id="appArea" class="hidden">

  <div class="topbar">

    <span class="menuBtn" id="menuBtn">⋮</span>

    <h2>Chatpoa</h2>

  </div>


  <div id="sideMenu" class="hidden">

    <button id="chatsMenuBtn">💬 Chats</button>

    <button id="profileBtn">👤 Profile</button>

    <button id="languageBtn">🌐 Language</button>

    <button id="settingsBtn">⚙️ Settings</button>

    <button id="logoutBtn">🚪 Logout</button>

  </div>


  <!-- CHATS -->

  <div id="chatsArea" class="container">

    <h2>💬 Chats</h2>

    <div class="searchBox">

      <input
        type="text"
        id="searchUser"
        placeholder="🔍 Tafuta mtu kwa email..."
      >

      <button id="searchBtn">Tafuta</button>

    </div>

    <p id="searchResult"></p>


    <h3 class="sectionTitle">👤 Private Chats</h3>

    <div id="privateChats">
      <div class="chatCard">
        Hakuna private chat bado.
      </div>
    </div>


    <h3 class="sectionTitle">👥 Groups</h3>

    <div id="groupChats">

      <div class="chatCard">
        Hakuna group bado.
      </div>

    </div>


    <button id="newChatBtn">
      ➕ New Chat
    </button>

    <button id="newGroupBtn">
      👥 Create Group
    </button>

  </div>


  <!-- PRIVATE CHAT -->

  <div id="privateChatArea" class="container hidden">

    <h2 id="privateChatTitle">
      👤 Private Chat
    </h2>

    <div id="chatMessages">
      <p>Hakuna ujumbe bado.</p>
    </div>

    <input
      type="text"
      id="chatInput"
      placeholder="Andika ujumbe..."
    >

    <button id="sendBtn">
      Tuma
    </button>

    <button class="secondary" id="backChatsBtn">
      ← Rudi Chats
    </button>

    <p id="privateMessage"></p>

  </div>


  <!-- GROUP -->

  <div id="groupArea" class="container hidden">

    <h2>👥 Create Group</h2>

    <input
      type="text"
      id="groupName"
      placeholder="Jina la group"
    >

    <textarea
      id="groupDescription"
      placeholder="Maelezo ya group"
    ></textarea>

    <input
      type="text"
      id="groupMembers"
      placeholder="Emails za members"
    >

    <button id="saveGroupBtn">
      Tengeneza Group
    </button>

    <button class="secondary" id="backGroupBtn">
      ← Rudi Chats
    </button>

    <p id="groupMessage"></p>

  </div>


  <!-- PROFILE -->

  <div id="profileArea" class="container hidden">

    <h2>👤 Profile</h2>

    <div class="profileIcon">
      👤
    </div>

    <input
      type="text"
      id="profileName"
      placeholder="Jina"
    >

    <textarea
      id="profileBio"
      placeholder="Andika kuhusu wewe"
    ></textarea>

    <input
      type="text"
      id="profileCountry"
      placeholder="Nchi"
    >

    <select id="profileLanguage">

      <option value="sw">Kiswahili</option>
      <option value="en">English</option>
      <option value="fr">Français</option>
      <option value="es">Español</option>
      <option value="ar">العربية</option>

    </select>

    <button id="saveProfileBtn">
      💾 Save Profile
    </button>

    <button class="secondary" id="backProfileBtn">
      ← Chats
    </button>

    <p id="profileMessage"></p>

  </div>


  <!-- LANGUAGE -->

  <div id="languageArea" class="container hidden">

    <h2>🌐 Language</h2>

    <select id="languageSelect">

      <option value="sw">🇹🇿 Kiswahili</option>
      <option value="en">🇬🇧 English</option>
      <option value="fr">🇫🇷 Français</option>
      <option value="es">🇪🇸 Español</option>
      <option value="ar">🇸🇦 العربية</option>

    </select>

    <button id="saveLanguageBtn">
      Save Language
    </button>

    <button class="secondary" id="backLanguageBtn">
      ← Chats
    </button>

  </div>


  <!-- SETTINGS -->

  <div id="settingsArea" class="container hidden">

    <h2>⚙️ Settings</h2>

    <p>
      Settings za Chatpoa zitaongezwa hapa.
    </p>

    <button class="secondary" id="backSettingsBtn">
      ← Chats
    </button>

  </div>

</div>


<script type="module">

import {
  initializeApp
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


import {
  getAuth,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword,
  onAuthStateChanged,
  signOut
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


import {
  getFirestore,
  doc,
  setDoc,
  getDoc,
  collection,
  query,
  where,
  getDocs,
  addDoc,
  onSnapshot,
  serverTimestamp
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


const firebaseConfig = {

  apiKey:
    "AIzaSyDeucp2-feD8Ml-nrBdgRyrwMQ78tZ0GAA",

  authDomain:
    "chatpoa-48730.firebaseapp.com",

  projectId:
    "chatpoa-48730",

  storageBucket:
    "chatpoa-48730.firebasestorage.app",

  messagingSenderId:
    "461917880378",

  appId:
    "1:461917880378:web:9ac8f125ac6790b44fb503",

  measurementId:
    "G-V55XB311DP"

};


const app =
  initializeApp(firebaseConfig);

const auth =
  getAuth(app);

const db =
  getFirestore(app);


const chatsArea =
  document.getElementById("chatsArea");

const privateChatArea =
  document.getElementById("privateChatArea");

const groupArea =
  document.getElementById("groupArea");

const profileArea =
  document.getElementById("profileArea");

const languageArea =
  document.getElementById("languageArea");

const settingsArea =
  document.getElementById("settingsArea");

const sideMenu =
  document.getElementById("sideMenu");


let currentChatUserId = null;

let currentChatUserName = null;

let unsubscribeSent = null;

let unsubscribeReceived = null;

let unsubscribeChatList = null;


/* PAGES */

function hidePages() {

  chatsArea.classList.add("hidden");

  privateChatArea.classList.add("hidden");

  groupArea.classList.add("hidden");

  profileArea.classList.add("hidden");

  languageArea.classList.add("hidden");

  settingsArea.classList.add("hidden");

}


function showChats() {

  hidePages();

  chatsArea.classList.remove("hidden");

  sideMenu.classList.add("hidden");

  stopMessageListeners();

}


/* STOP CHAT LISTENERS */

function stopMessageListeners() {

  if (unsubscribeSent) {

    unsubscribeSent();

    unsubscribeSent = null;

  }

  if (unsubscribeReceived) {

    unsubscribeReceived();

    unsubscribeReceived = null;

  }

}


/* SIGNUP */

document
.getElementById("signupBtn")
.addEventListener("click", async () => {

  const name =
    document
    .getElementById("name")
    .value
    .trim();

  const email =
    document
    .getElementById("email")
    .value
    .trim()
    .toLowerCase();

  const password =
    document
    .getElementById("password")
    .value;


  if (!name || !email || !password) {

    document
    .getElementById("message")
    .textContent =
    "Jaza taarifa zote.";

    return;

  }


  try {

    const userCredential =
      await createUserWithEmailAndPassword(
        auth,
        email,
        password
      );


    await setDoc(
      doc(
        db,
        "users",
        userCredential.user.uid
      ),
      {

        name: name,

        email: email,

        bio: "",

        country: "",

        language: "sw"

      }
    );


    document
    .getElementById("message")
    .textContent =
    "Umejisajili kikamilifu!";

  }

  catch (error) {

    document
    .getElementById("message")
    .textContent =
    error.message;

  }

});


/* LOGIN */

document
.getElementById("loginBtn")
.addEventListener("click", async () => {

  const email =
    document
    .getElementById("loginEmail")
    .value
    .trim()
    .toLowerCase();

  const password =
    document
    .getElementById("loginPassword")
    .value;


  if (!email || !password) {

    document
    .getElementById("message")
    .textContent =
    "Weka email na password.";

    return;

  }


  try {

    await signInWithEmailAndPassword(
      auth,
      email,
      password
    );

  }

  catch (error) {

    document
    .getElementById("message")
    .textContent =
    error.message;

  }

});


/* AUTH */

onAuthStateChanged(
  auth,
  (user) => {

    if (user) {

      document
      .getElementById("authArea")
      .classList
      .add("hidden");

      document
      .getElementById("appArea")
      .classList
      .remove("hidden");

      showChats();

      loadPrivateChats();

    }

    else {

      document
      .getElementById("authArea")
      .classList
      .remove("hidden");

      document
      .getElementById("appArea")
      .classList
      .add("hidden");

      if (unsubscribeChatList) {

        unsubscribeChatList();

        unsubscribeChatList = null;

      }

    }

  }
);


/* MENU */

document
.getElementById("menuBtn")
.addEventListener("click", () => {

  sideMenu
  .classList
  .toggle("hidden");

});


document
.getElementById("chatsMenuBtn")
.addEventListener(
  "click",
  showChats
);


/* SEARCH */

document
.getElementById("searchBtn")
.addEventListener(
  "click",
  async () => {

    const email =
      document
      .getElementById("searchUser")
      .value
      .trim()
      .toLowerCase();

    const result =
      document
      .getElementById("searchResult");


    const currentUser =
      auth.currentUser;


    if (!email) {

      result.textContent =
      "Andika email ya mtu.";

      return;

    }


    if (!currentUser) {

      result.textContent =
      "Login kwanza.";

      return;

    }


    if (
      email ===
      currentUser.email
    ) {

      result.textContent =
      "Huwezi kuanzisha chat na wewe mwenyewe.";

      return;

    }


    try {

      const q =
        query(
          collection(db, "users"),
          where("email", "==", email)
        );


      const snapshot =
        await getDocs(q);


      if (snapshot.empty) {

        result.textContent =
        "User hajapatikana.";

        return;

      }


      snapshot.forEach(
        (userDoc) => {

          const data =
            userDoc.data();


          result.innerHTML =
          "👤 <b>" +
          data.name +
          "</b><br>" +
          data.email;


          const button =
            document.createElement("button");


          button.textContent =
          "💬 Fungua Chat";


          button.onclick =
          () => {

            openPrivateChat(
              userDoc.id,
              data.name
            );

          };


          result.appendChild(button);

        }
      );

    }

    catch (error) {

      result.textContent =
      "Kuna tatizo: " +
      error.message;

    }

  }
);


/* OPEN CHAT */

function openPrivateChat(
  userId,
  userName
) {

  currentChatUserId =
  userId;

  currentChatUserName =
  userName;


  hidePages();

  privateChatArea
  .classList
  .remove("hidden");


  document
  .getElementById("privateChatTitle")
  .textContent =
  "💬 Chat na " +
  userName;


  document
  .getElementById("chatInput")
  .value = "";


  loadMessages();

}


/* LOAD MESSAGES */

function loadMessages() {

  stopMessageListeners();


  const currentUser =
    auth.currentUser;


  if (
    !currentUser ||
    !currentChatUserId
  ) {

    return;

  }


  const messagesArea =
    document
    .getElementById("chatMessages");


  messagesArea.innerHTML =
  "<p>Inapakia ujumbe...</p>";


  let sentMessages = [];

  let receivedMessages = [];


  function displayMessages() {

    const allMessages =
      [
        ...sentMessages,
        ...receivedMessages
      ];


    const unique =
      new Map();


    allMessages.forEach(
      item => {

        unique.set(
          item.id,
          item
        );

      }
    );


    const messages =
      Array.from(
        unique.values()
      );


    messages.sort(
      (a, b) => {

        const aTime =
          a.createdAt &&
          a.createdAt.toMillis
          ? a.createdAt.toMillis()
          : 0;


        const bTime =
          b.createdAt &&
          b.createdAt.toMillis
          ? b.createdAt.toMillis()
          : 0;


        return aTime - bTime;

      }
    );


    messagesArea.innerHTML = "";


    if (!messages.length) {

      messagesArea.innerHTML =
      "<p>Hakuna ujumbe bado.</p>";

      return;

    }


    messages.forEach(
      message => {

        const div =
          document.createElement("div");


        div.classList.add(
          "message"
        );


        if (
          message.senderId ===
          currentUser.uid
        ) {

          div.classList.add(
            "myMessage"
          );

        }

        else {

          div.classList.add(
            "theirMessage"
          );

        }


        div.textContent =
        message.text || "";


        messagesArea.appendChild(
          div
        );

      }
    );


    messagesArea.scrollTop =
    messagesArea.scrollHeight;

  }


  const sentQuery =
    query(
      collection(db, "messages"),
      where(
        "senderId",
        "==",
        currentUser.uid
      )
    );


  const receivedQuery =
    query(
      collection(db, "messages"),
      where(
        "receiverId",
        "==",
        currentUser.uid
      )
    );


  unsubscribeSent =
    onSnapshot(
      sentQuery,
      snapshot => {

        sentMessages =
          snapshot.docs
          .map(
            item => ({
              id: item.id,
              ...item.data()
            })
          )
          .filter(
            item =>
            item.receiverId ===
            currentChatUserId
          );


        displayMessages();

      }
    );


  unsubscribeReceived =
    onSnapshot(
      receivedQuery,
      snapshot => {

        receivedMessages =
          snapshot.docs
          .map(
            item => ({
              id: item.id,
              ...item.data()
            })
          )
          .filter(
            item =>
            item.senderId ===
            currentChatUserId
          );


        displayMessages();

      }
    );

}


/* PRIVATE CHAT LIST */

function loadPrivateChats() {

  const currentUser =
    auth.currentUser;


  if (!currentUser) {

    return;

  }


  const privateChats =
    document.getElementById(
      "privateChats"
    );


  if (unsubscribeChatList) {

    unsubscribeChatList();

  }


  const sentQuery =
    query(
      collection(db, "messages"),
      where(
        "senderId",
        "==",
        currentUser.uid
      )
    );


  const receivedQuery =
    query(
      collection(db, "messages"),
      where(
        "receiverId",
        "==",
        currentUser.uid
      )
    );


  let sent = [];

  let received = [];


  function updateList() {

    const all =
      [
        ...sent,
        ...received
      ];


    const conversations = {};


    all.forEach(
      message => {

        const otherUserId =
          message.senderId ===
          currentUser.uid
          ? message.receiverId
          : message.senderId;


        if (
          !conversations[otherUserId]
        ) {

          conversations[otherUserId] =
          message;

        }

        else {

          const old =
            conversations[otherUserId];


          const oldTime =
            old.createdAt &&
            old.createdAt.toMillis
            ? old.createdAt.toMillis()
            : 0;


          const newTime =
            message.createdAt &&
            message.createdAt.toMillis
            ? message.createdAt.toMillis()
            : 0;


          if (
            newTime >= oldTime
          ) {

            conversations[otherUserId] =
            message;

          }

        }

      }
    );


    const ids =
      Object.keys(
        conversations
      );


    privateChats.innerHTML = "";


    if (!ids.length) {

      privateChats.innerHTML =
      `<div class="chatCard">
        Hakuna private chat bado.
      </div>`;

      return;

    }


    ids.forEach(
      async otherUserId => {

        let userName =
        "Chatpoa User";


        try {

          const userDoc =
            await getDoc(
              doc(
                db,
                "users",
                otherUserId
              )
            );


          if (
            userDoc.exists()
          ) {

            userName =
              userDoc.data().name ||
              "Chatpoa User";

          }

        }

        catch (error) {

          console.error(error);

        }


        const lastMessage =
          conversations[
            otherUserId
          ];


        const card =
          document.createElement(
            "div"
          );


        card.className =
        "chatCard";


        const name =
          document.createElement(
            "div"
          );


        name.className =
        "chatName";


        name.textContent =
        "👤 " +
        userName;


        const last =
          document.createElement(
            "div"
          );


        last.className =
        "lastMessage";


        last.textContent =
        lastMessage.text ||
        "";


        card.appendChild(name);

        card.appendChild(last);


        card.onclick =
        () => {

          openPrivateChat(
            otherUserId,
            userName
          );

        };


        privateChats.appendChild(
          card
        );

      }
    );

  }


  const sentListener =
    onSnapshot(
      sentQuery,
      snapshot => {

        sent =
          snapshot.docs
          .map(
            item => ({
              id: item.id,
              ...item.data()
            })
          );


        updateList();

      }
    );


  const receivedListener =
    onSnapshot(
      receivedQuery,
      snapshot => {

        received =
          snapshot.docs
          .map(
            item => ({
              id: item.id,
              ...item.data()
            })
          );


        updateList();

      }
    );


  unsubscribeChatList =
  () => {

    sentListener();

    receivedListener();

  };

}


/* SEND MESSAGE */

document
.getElementById("sendBtn")
.addEventListener(
  "click",
  async () => {

    const currentUser =
      auth.currentUser;


    const input =
      document
      .getElementById("chatInput");


    const text =
      input.value.trim();


    const status =
      document
      .getElementById(
        "privateMessage"
      );


    if (!currentUser) {

      status.textContent =
      "Login kwanza.";

      return;

    }


    if (!currentChatUserId) {

      status.textContent =
      "Tafuta mtu kwanza.";

      return;

    }


    if (!text) {

      return;

    }


    try {

      await addDoc(
        collection(
          db,
          "messages"
        ),
        {

          senderId:
          currentUser.uid,

          receiverId:
          currentChatUserId,

          text:
          text,

          createdAt:
          serverTimestamp()

        }
      );


      input.value = "";

      status.textContent = "";

    }

    catch (error) {

      status.textContent =
      "Ujumbe haujatumwa: " +
      error.message;

    }

  }
);


/* ENTER SEND */

document
.getElementById("chatInput")
.addEventListener(
  "keydown",
  event => {

    if (
      event.key === "Enter"
    ) {

      event.preventDefault();

      document
      .getElementById("sendBtn")
      .click();

    }

  }
);


/* NEW CHAT */

document
.getElementById("newChatBtn")
.addEventListener(
  "click",
  () => {

    hidePages();

    privateChatArea
    .classList
    .remove("hidden");


    currentChatUserId =
    null;


    currentChatUserName =
    null;


    stopMessageListeners();


    document
    .getElementById(

/* PROFILE */

document
.getElementById("profileBtn")
.addEventListener(
  "click",
  async () => {

    hidePages();

    profileArea
    .classList
    .remove("hidden");

    sideMenu
    .classList
    .add("hidden");


    const user =
      auth.currentUser;


    if (!user) return;


    try {

      const userDoc =
        await getDoc(
          doc(
            db,
            "users",
            user.uid
          )
        );


      if (
        userDoc.exists()
      ) {

        const data =
          userDoc.data();


        document
        .getElementById(
          "profileName"
        )
        .value =
        data.name || "";


        document
        .getElementById(
          "profileBio"
        )
        .value =
        data.bio || "";


        document
        .getElementById(
          "profileCountry"
        )
        .value =
        data.country || "";


        document
        .getElementById(
          "profileLanguage"
        )
        .value =
        data.language || "sw";

      }

    }

    catch (error) {

      document
      .getElementById(
        "profileMessage"
      )
      .textContent =
      error.message;

    }

  }
);


/* SAVE PROFILE */

document
.getElementById("saveProfileBtn")
.addEventListener(
  "click",
  async () => {

    const user =
      auth.currentUser;


    if (!user) return;


    try {

      await setDoc(
        doc(
          db,
          "users",
          user.uid
        ),
        {

          name:
          document
          .getElementById(
            "profileName"
          )
          .value
          .trim(),

          bio:
          document
          .getElementById(
            "profileBio"
          )
          .value
          .trim(),

          country:
          document
          .getElementById(
            "profileCountry"
          )
          .value
          .trim(),

          language:
          document
          .getElementById(
            "profileLanguage"
          )
          .value

        },
        {
          merge: true
        }
      );


      document
      .getElementById(
        "profileMessage"
      )
      .textContent =
      "Profile imehifadhiwa!";

    }

    catch (error) {

      document
      .getElementById(
        "profileMessage"
      )
      .textContent =
      error.message;

    }

  }
);
