<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chatpoa</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f2f5f7;
    }

    .topbar {
      height: 60px;
      background: #1877f2;
      color: white;
      display: flex;
      align-items: center;
      padding: 0 15px;
      position: relative;
    }

    .menuBtn {
      font-size: 30px;
      cursor: pointer;
      margin-right: 15px;
    }

    .topbar h2 {
      margin: 0;
    }

    .container {
      max-width: 450px;
      margin: 20px auto;
      background: white;
      padding: 20px;
      border-radius: 15px;
    }

    input,
    textarea,
    select,
    button {
      width: 100%;
      padding: 12px;
      margin: 7px 0;
      border-radius: 8px;
      border: 1px solid #ccc;
    }

    button {
      background: #1877f2;
      color: white;
      border: none;
      font-weight: bold;
      cursor: pointer;
    }

    .secondary {
      background: #555;
    }

    .hidden {
      display: none !important;
    }

    #sideMenu {
      position: fixed;
      top: 60px;
      left: 0;
      width: 240px;
      background: white;
      box-shadow: 2px 4px 10px #0003;
      padding: 15px;
      z-index: 20;
    }

    #sideMenu button {
      background: white;
      color: #222;
      text-align: left;
      border-bottom: 1px solid #eee;
    }

    .searchBox {
      display: flex;
      gap: 5px;
    }

    .searchBox input {
      flex: 1;
    }

    .searchBox button {
      width: 90px;
    }

    .sectionTitle {
      margin-top: 25px;
      border-bottom: 1px solid #ddd;
      padding-bottom: 8px;
    }

    .chatCard {
      padding: 14px;
      margin: 8px 0;
      background: #f5f7f9;
      border-radius: 10px;
      cursor: pointer;
    }

    .chatCard:hover {
      background: #e5edf7;
    }

    .profileIcon {
      width: 80px;
      height: 80px;
      background: #ddd;
      border-radius: 50%;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 35px;
    }

    #message,
    #profileMessage,
    #groupMessage,
    #privateMessage {
      text-align: center;
      font-weight: bold;
    }

    #languageArea h2 {
      text-align: center;
    }

    #languageSelect {
      font-size: 16px;
      background: white;
    }
  </style>
</head>

<body>

<!-- SIGNUP / LOGIN -->

<div id="authArea" class="container">

  <h1>Karibu Chatpoa</h1>

  <h2>Jisajili</h2>

  <input
    type="text"
    id="name"
    placeholder="Jina lako"
  >

  <input
    type="email"
    id="email"
    placeholder="Email"
  >

  <input
    type="password"
    id="password"
    placeholder="Password"
  >

  <button id="signupBtn">Jisajili</button>

  <hr>

  <h2>Login</h2>

  <input
    type="email"
    id="loginEmail"
    placeholder="Email"
  >

  <input
    type="password"
    id="loginPassword"
    placeholder="Password"
  >

  <button id="loginBtn">Login</button>

  <p id="message"></p>

</div>


<!-- APP -->

<div id="appArea" class="hidden">

  <!-- TOP BAR -->

  <div class="topbar">

    <span class="menuBtn" id="menuBtn">⋮</span>

    <h2 id="appTitle">Chatpoa</h2>

  </div>


  <!-- MENU -->

  <div id="sideMenu" class="hidden">

    <button id="chatsMenuBtn">💬 Chats</button>

    <button id="profileBtn">👤 Profile</button>

    <button id="languageBtn">🌐 Language</button>

    <button id="settingsBtn">⚙️ Settings</button>

    <button id="logoutBtn">🚪 Logout</button>

  </div>


  <!-- CHATS HOME -->

  <div id="chatsArea" class="container">

    <h2 id="chatsTitle">💬 Chats</h2>

    <div class="searchBox">

      <input
        type="text"
        id="searchUser"
        placeholder="🔍 Tafuta mtu..."
      >

      <button id="searchBtn">Tafuta</button>

    </div>

    <p id="searchResult"></p>


    <h3 class="sectionTitle" id="privateChatsTitle">
      👤 Private Chats
    </h3>

    <div id="privateChats">

      <div class="chatCard" id="noPrivateText">
        Hakuna private chat bado.
      </div>

    </div>


    <h3 class="sectionTitle" id="groupsTitle">
      👥 Groups
    </h3>

    <div id="groupChats">

      <div class="chatCard" id="noGroupsText">
        Hakuna group bado.
      </div>

    </div>


    <button id="newChatBtn">
      ➕ New Chat
    </button>

    <button id="newGroupBtn">
      👥 Create Group
    </button>

  </div>


  <!-- PRIVATE CHAT -->

  <div id="privateChatArea" class="container hidden">

    <h2 id="privateChatTitle">
      👤 Private Chat
    </h2>

    <div
      id="chatMessages"
      style="min-height:150px;background:#f5f5f5;padding:10px;border-radius:10px;"
    >
      <p id="noMessagesText">
        Hakuna ujumbe bado.
      </p>
    </div>

    <input
      type="text"
      id="chatInput"
      placeholder="Andika ujumbe..."
    >

    <button id="sendBtn">
      Tuma
    </button>

    <button class="secondary" id="backChatsBtn">
      ← Rudi Chats
    </button>

    <p id="privateMessage"></p>

  </div>


  <!-- CREATE GROUP -->

  <div id="groupArea" class="container hidden">

    <h2 id="createGroupTitle">
      👥 Create Group
    </h2>

    <input
      type="text"
      id="groupName"
      placeholder="Jina la group"
    >

    <textarea
      id="groupDescription"
      placeholder="Maelezo ya group"
    ></textarea>

    <input
      type="text"
      id="groupMembers"
      placeholder="Emails za members, mfano: a@gmail.com, b@gmail.com"
    >

    <button id="saveGroupBtn">
      Tengeneza Group
    </button>

    <button class="secondary" id="backGroupBtn">
      ← Rudi Chats
    </button>

    <p id="groupMessage"></p>

  </div>


  <!-- PROFILE -->

  <div id="profileArea" class="container hidden">

    <h2 id="profileTitle">
      👤 Profile
    </h2>

    <div class="profileIcon">
      👤
    </div>

    <input
      type="text"
      id="profileName"
      placeholder="Jina"
    >

    <textarea
      id="profileBio"
      placeholder="Andika kuhusu wewe"
    ></textarea>

    <input
      type="text"
      id="profileCountry"
      placeholder="Nchi"
    >

    <select id="profileLanguage">

      <option value="sw">Kiswahili</option>
      <option value="en">English</option>
      <option value="fr">Français</option>
      <option value="es">Español</option>
      <option value="ar">العربية</option>

    </select>

    <button id="saveProfileBtn">
      💾 Save Profile
    </button>

    <button class="secondary" id="backProfileBtn">
      ← Chats
    </button>

    <p id="profileMessage"></p>

  </div>


  <!-- LANGUAGE -->

  <div id="languageArea" class="container hidden">

    <h2 id="languageTitle">
      🌐 Language
    </h2>

    <select id="languageSelect">

      <option value="sw">🇹🇿 Kiswahili</option>

      <option value="en">🇬🇧 English</option>

      <option value="fr">🇫🇷 Français</option>

      <option value="es">🇪🇸 Español</option>

      <option value="ar">🇸🇦 العربية</option>

    </select>

    <button id="saveLanguageBtn">
      Hifadhi Lugha
    </button>

    <button class="secondary" id="backLanguageBtn">
      ← Chats
    </button>

  </div>


  <!-- SETTINGS -->

  <div id="settingsArea" class="container hidden">

    <h2 id="settingsTitle">
      ⚙️ Settings
    </h2>

    <p id="settingsText">
      Settings za Chatpoa zitaongezwa hapa.
    </p>

    <button class="secondary" id="backSettingsBtn">
      ← Chats
    </button>

  </div>

</div>

  function applyLanguage(lang) {

    const t =
      translations[lang] || translations.sw;


    document.documentElement.lang = lang;


    document.getElementById("chatsMenuBtn").textContent =
      t.chats;

    document.getElementById("profileBtn").textContent =
      t.profile;

    document.getElementById("languageBtn").textContent =
      t.language;

    document.getElementById("settingsBtn").textContent =
      t.settings;

    document.getElementById("logoutBtn").textContent =
      t.logout;


    document.getElementById("chatsTitle").textContent =
      t.chatsTitle;

    document.getElementById("privateChatsTitle").textContent =
      t.privateChats;

    document.getElementById("noPrivateText").textContent =
      t.noPrivate;

    document.getElementById("groupsTitle").textContent =
      t.groups;

    document.getElementById("noGroupsText").textContent =
      t.noGroups;


    document.getElementById("newChatBtn").textContent =
      t.newChat;

    document.getElementById("newGroupBtn").textContent =
      t.createGroup;


    document.getElementById("privateChatTitle").textContent =
      t.privateChat;

    document.getElementById("sendBtn").textContent =
      t.send;

    document.getElementById("backChatsBtn").textContent =
      t.backChats;


    document.getElementById("languageTitle").textContent =
      t.languageTitle;

    document.getElementById("saveLanguageBtn").textContent =
      t.saveLanguage;

    document.getElementById("backLanguageBtn").textContent =
      t.backChats;


    document.getElementById("profileTitle").textContent =
      t.profileTitle;

    document.getElementById("saveProfileBtn").textContent =
      t.saveProfile;

    document.getElementById("backProfileBtn").textContent =
      t.backChats;


    document.getElementById("settingsTitle").textContent =
      t.settingsTitle;

    document.getElementById("settingsText").textContent =
      t.settingsText;

    document.getElementById("backSettingsBtn").textContent =
      t.backChats;


    document.getElementById("createGroupTitle").textContent =
      t.createGroupTitle;

    document.getElementById("searchBtn").textContent =
      t.search;


    document.getElementById("searchUser").placeholder =
      t.searchPlaceholder;

    document.getElementById("chatInput").placeholder =
      t.messagePlaceholder;

  }


  /* =========================
     SIGNUP
  ========================= */

  document.getElementById("signupBtn")
    .addEventListener("click", async () => {

      const name =
        document.getElementById("name").value.trim();

      const email =
        document.getElementById("email").value.trim();

      const password =
        document.getElementById("password").value;


      if (!name || !email || !password) {

        document.getElementById("message").textContent =
          "Jaza taarifa zote.";

        return;
      }


      try {

        const userCredential =
          await createUserWithEmailAndPassword(
            auth,
            email,
            password
          );


        await setDoc(
          doc(db, "users", userCredential.user.uid),
          {
            name: name,
            email: email,
            bio: "",
            country: "",
            language: "sw"
          }
        );


        document.getElementById("message").textContent =
          "Umejisajili kikamilifu!";

      }

      catch (error) {

        document.getElementById("message").textContent =
          error.message;

      }

    });


  /* =========================
     LOGIN
  ========================= */

  document.getElementById("loginBtn")
    .addEventListener("click", async () => {

      const email =
        document.getElementById("loginEmail").value.trim();

      const password =
        document.getElementById("loginPassword").value;


      if (!email || !password) {

        document.getElementById("message").textContent =
          "Weka email na password.";

        return;
      }


      try {

        await signInWithEmailAndPassword(
          auth,
          email,
          password
        );

      }

      catch (error) {

        document.getElementById("message").textContent =
          error.message;

      }

    });


  /* =========================
     AUTH
  ========================= */

  onAuthStateChanged(auth, async (user) => {

    if (user) {

      document.getElementById("authArea")
        .classList.add("hidden");

      document.getElementById("appArea")
        .classList.remove("hidden");


      try {

        const userDoc =
          await getDoc(
            doc(db, "users", user.uid)
          );


        if (userDoc.exists()) {

          const data = userDoc.data();

          const savedLanguage =
            data.language || "sw";

          document.getElementById("languageSelect").value =
            savedLanguage;

          document.getElementById("profileLanguage").value =
            savedLanguage;

          applyLanguage(savedLanguage);

        }

        else {

          applyLanguage("sw");

        }

      }

      catch (error) {

        applyLanguage("sw");

      }


      showChats();

    }

    else {

      document.getElementById("authArea")
        .classList.remove("hidden");

      document.getElementById("appArea")
        .classList.add("hidden");

    }

  });
